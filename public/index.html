<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- Register FCM service worker for web push notifications -->
    <script>
      // Public Firebase config — safe to expose in client
      window.__FIREBASE_CONFIG__ = {
        apiKey: "AIzaSyD3xDlMt7aYdYsutNLYoMcm63LoLt_1Oxo",
        authDomain: "connectdoctor-8d202.firebaseapp.com",
        projectId: "connectdoctor-8d202",
        storageBucket: "connectdoctor-8d202.firebasestorage.app",
        messagingSenderId: "1063151091025",
        appId: "1:1063151091025:web:9f7613a32dcfe2d54fa770",
      };
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/firebase-messaging-sw.js")
          .then(function (reg) {
            var sw = reg.installing || reg.waiting || reg.active;
            if (sw) sw.postMessage({ type: "FIREBASE_CONFIG", config: window.__FIREBASE_CONFIG__ });
          })
          .catch(console.error);
      }
    </script>
  </body>
</html>
